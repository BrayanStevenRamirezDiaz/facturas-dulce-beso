<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4a2c20">
<title>Facturas Dulce Beso</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --cafe: #4a2c20; --fondo: #f3eadc; --borde: #c9b392; --texto: #2b1d17; --campo: #fff; --tarj: #fffdf9; --sombra: rgba(74, 44, 32, .12); --suave: #6b5042; }
  @media (prefers-color-scheme: dark) { :root { --cafe: #e8d9c4; --fondo: #1f1713; --borde: #5a4636; --texto: #f3eadf; --campo: #1f1713; --tarj: #2b211b; --sombra: rgba(0, 0, 0, .4); --suave: #cdbba8; } }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, 'Liberation Sans', sans-serif; background: var(--fondo); color: var(--texto); }
  main { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 16px; }
  .marca { position: fixed; left: 50%; top: 50%; width: min(90vw, 520px); transform: translate(-50%, -50%); opacity: .12; pointer-events: none; z-index: 0; }
  @media (prefers-color-scheme: dark) { .marca { opacity: .10; } }
  .logo { display: block; margin: 0 auto 4px; width: 140px; height: auto; }
  h1 { color: var(--cafe); font-size: 1.4rem; margin: 0 0 12px; text-align: center; }
  .card { background: color-mix(in srgb, var(--tarj) 78%, transparent); border: 1px solid var(--borde); border-radius: 14px; padding: 12px 14px 16px; margin-bottom: 14px; box-shadow: 0 2px 8px var(--sombra); }
  h2 { font-size: .95rem; margin: 0 0 6px; color: var(--cafe); border-bottom: 2px solid var(--cafe); padding-bottom: 5px; text-transform: uppercase; letter-spacing: .8px; }
  label { display: block; font-size: .85rem; margin: 10px 0 2px; color: var(--suave); }
  input, textarea { width: 100%; padding: 12px; font-size: 1rem; border: 1.5px solid var(--borde); border-radius: 8px; background: var(--campo); color: var(--texto); }
  .linea { border: 1px dashed var(--borde); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button { font-size: 1rem; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--cafe); background: var(--campo); color: var(--cafe); }
  button.principal { background: var(--cafe); color: var(--fondo); width: 100%; margin-top: 4px; padding: 14px; border-radius: 10px; font-weight: 700; box-shadow: 0 3px 8px var(--sombra); }
  button.quitar { float: right; padding: 4px 10px; }
  [hidden] { display: none !important; }
  .opcion { display: block; text-decoration: none; color: var(--texto); background: color-mix(in srgb, var(--tarj) 85%, transparent); border: 1px solid var(--borde); border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px var(--sombra); }
  .opcion b { display: block; font-size: 1.1rem; color: var(--cafe); text-transform: uppercase; letter-spacing: .8px; }
  .opcion small { color: var(--suave); }
  .volver { display: inline-block; color: var(--cafe); text-decoration: none; padding: 6px 0; font-weight: 700; }
  textarea.concepto { resize: vertical; }
  #errores { color: #d32f2f; margin-top: 12px; white-space: pre-line; }
  #total { font-weight: 600; margin-top: 8px; }
  #historial button { display: block; width: 100%; text-align: left; margin-bottom: 6px; }
</style>
</head>
<body>
<img class="marca" src="assets/logo.png" alt="" aria-hidden="true">
<main>
  <img class="logo" src="assets/logo.png" alt="El Dulce Beso">
  <section id="menu">
    <h1>¿Qué documento vas a hacer?</h1>
    <a class="opcion" href="#factura"><b>Factura</b><small>Pedido con productos y entrega</small></a>
    <a class="opcion" href="#cobro"><b>Cuenta de cobro</b><small>Lo que te deben por un trabajo</small></a>
    <a class="opcion" href="#cotizacion"><b>Cotización</b><small>Precios para que el cliente apruebe</small></a>
    <section class="card" style="margin-top: 18px">
      <h2>Documentos recientes</h2>
      <div id="historial"></div>
    </section>
  </section>

  <section id="editor" hidden>
  <a class="volver" href="#">‹ Volver</a>
  <h1 id="titulo">Nueva factura</h1>
  <form id="form" autocomplete="off">
    <section class="card">
      <h2>Fecha</h2>
      <label for="fecha">Fecha de la factura</label>
      <input id="fecha" type="date" required>
    </section>

    <section class="card">
      <h2>Cliente</h2>
      <label for="cliente">Nombre de la empresa o persona</label>
      <input id="cliente" list="clientes" required>
      <datalist id="clientes"></datalist>
      <label for="nit">NIT (opcional)</label>
      <input id="nit" inputmode="numeric">
    </section>

    <section class="card" data-tipos="cobro">
      <h2>Por concepto de</h2>
      <label for="porConcepto">Motivo del cobro</label>
      <input id="porConcepto" placeholder="productos de Halloween">
    </section>

    <section class="card">
      <h2>Productos</h2>
      <div id="lineas"></div>
      <button type="button" id="agregar">+ Agregar producto</button>
      <div id="total"></div>
    </section>

    <section class="card">
      <h2>Entrega y notas</h2>
      <label for="entrega">Fecha y hora de entrega (opcional)</label>
      <input id="entrega" placeholder="5 de diciembre del 2026 a las 4 pm">
      <label for="notas">Notas (envío, etc.)</label>
      <textarea id="notas" rows="2"></textarea>
      <div data-tipos="factura cobro">
        <label for="abono">Abono % (opcional, ej. 50)</label>
        <input id="abono" type="number" inputmode="numeric" min="1" max="100">
      </div>
    </section>

    <div id="errores" role="alert"></div>
    <button class="principal" type="submit">Generar PDF</button>
  </form>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
